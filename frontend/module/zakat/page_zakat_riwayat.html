<div
  id="zakat-riwayat-aaa"
  class="content"
  style="display: none; font-family: poppins, sans-serif">
  <div class="grid grid-cols-12 gap-6">
    <div class="col-span-12 2xl:col-span-9">
      <div class="flex flex-col gap-6">
        <div class="bg-white shadow rounded-lg p-5 mt-5">
          <h3 class="text-lg font-semibold mb-3 text-primary">Riwayat Zakat</h3>
          <div class="overflow-x-auto">
            <table class="min-w-full border text-sm">
              <thead class="bg-gray-100">
                <tr>
                  <th class="px-3 py-2 border">No</th>
                  <th class="px-3 py-2 border">Tanggal Dibuat</th>
                  <th class="px-3 py-2 border">Jenis Zakat</th>
                  <th class="px-3 py-2 border">Keterangan Nishab</th>
                  <th class="px-3 py-2 border">Jumlah Zakat</th>
                  <th class="px-3 py-2 border">Action</th>
                </tr>
              </thead>
              <tbody id="zakatRiwayatTableBody">
                <!-- Data riwayat zakat akan diisi oleh JS -->
              </tbody>
            </table>
          </div>
        </div>
        <div
          id="zakatDetailModal"
          style="
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
          ">
          <div
            style="
              background: #fff;
              border-radius: 8px;
              max-width: 95vw;
              width: 500px;
              max-height: 90vh;
              overflow: auto;
              box-shadow: 0 2px 16px #0002;
              position: relative;
            ">
            <button
              id="closeZakatDetailModal"
              style="
                position: absolute;
                right: 10px;
                top: 10px;
                font-size: 20px;
                background: none;
                border: none;
                cursor: pointer;
              ">
              &times;
            </button>
            <div
              id="zakatDetailContent"
              style="padding: 24px 16px 16px 16px"></div>
          </div>
        </div>
        <script>
          function renderZakatDetailTable(item) {
            // Tampilkan tabel sesuai jenis_zakat
            if (
              item.jenis_zakat &&
              item.jenis_zakat.toLowerCase().includes("pertanian")
            ) {
              return `<table class="w-full table-auto border text-left">
              <thead class="bg-gray-100"><tr><th class="border px-4 py-2">Jenis Pengairan</th><th class="border px-4 py-2">Hasil Panen (kg)</th><th class="border px-4 py-2">Persentase Zakat</th><th class="border px-4 py-2">Zakat (kg)</th></tr></thead>
              <tbody><tr><td class="border px-4 py-2">${
                item.jenis_pengairan || "-"
              }</td><td class="border px-4 py-2">${
                item.hasil_panen || "-"
              }</td><td class="border px-4 py-2">${
                item.persentase_zakat ? item.persentase_zakat + "%" : "-"
              }</td><td class="border px-4 py-2">${
                item.zakat_25 || "-"
              }</td></tr></tbody></table>`;
            }
            if (
              item.jenis_zakat &&
              item.jenis_zakat.toLowerCase().includes("perniagaan")
            ) {
              function safeRupiah(val) {
                return val && !isNaN(val)
                  ? "Rp " + Number(val).toLocaleString("id-ID")
                  : "-";
              }
              return `<table class="w-full table-auto border text-left">
<thead class="bg-gray-100">
  <tr>
    <th class="border px-4 py-2">Komponen</th>
    <th class="border px-4 py-2">Nilai (Rp)</th>
  </tr>
</thead>
<tbody>
  <tr>
    <td class="border px-4 py-2" data-label="Komponen">Kas / Uang Tunai</td>
    <td class="border px-4 py-2" data-label="Nilai (Rp)">${safeRupiah(
      item.uang_tunai
    )}</td>
  </tr>
  <tr>
    <td class="border px-4 py-2" data-label="Komponen">Persediaan Barang Dagangan</td>
    <td class="border px-4 py-2" data-label="Nilai (Rp)">${safeRupiah(
      item.persediaan_barang_dagangan
    )}</td>
  </tr>
  <tr>
    <td class="border px-4 py-2" data-label="Komponen">Piutang (yang bisa ditagih)</td>
    <td class="border px-4 py-2" data-label="Nilai (Rp)">${safeRupiah(
      item.piutang
    )}</td>
  </tr>
  <tr>
    <td class="border px-4 py-2" data-label="Komponen">Dikurangi: Utang Jatuh Tempo</td>
    <td class="border px-4 py-2" data-label="Nilai (Rp)">${safeRupiah(
      item.uang_jatuh_tempo
    )}</td>
  </tr>
  <tr class="font-semibold bg-yellow-100">
    <td class="border px-4 py-2" data-label="Komponen">Total Harta Bersih</td>
    <td class="border px-4 py-2 text-blue-600" data-label="Nilai (Rp)">${safeRupiah(
      item.total
    )}</td>
  </tr>
  <tr>
    <td class="border px-4 py-2" data-label="Komponen">Status</td>
    <td class="border px-4 py-2 font-bold ${
      item.keterangan_nishab === "Mencapai Nishab"
        ? "text-green-600"
        : "text-red-600"
    }" data-label="Nilai (Rp)">
      ${item.keterangan_nishab || "-"}
    </td>
  </tr>
  <tr class="font-bold bg-green-100">
    <td class="border px-4 py-2" data-label="Komponen">Zakat 2.5%</td>
    <td class="border px-4 py-2 text-red-600" data-label="Nilai (Rp)">${safeRupiah(
      item.zakat_25
    )}</td>
  </tr>
</tbody>
</table>

<div class="mt-6 bg-gray-50 border-l-4 border-green-600 p-4 rounded">
  <h3 class="text-lg font-semibold mb-2">Dalil Zakat Perniagaan</h3>
  <strong>Hadis No. 492 dalam Bulugh al-Maram :</strong>
  <div class="flex flex-col text-center mt-4 gap-2">
    <p class="text-xl mt-4 text-gray-700">    
      عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ:
      "مَا مِنْ صَاحِبِ ذَهَبٍ وَلَا فِضَّةٍ لَا يُؤَدِّي مِنْهَا حَقَّهَا إِلَّا إِذَا كَانَ يَوْمُ الْقِيَامَةِ صُفِّحَتْ لَهُ صَفَائِحُ مِنْ نَارٍ، فَأُحْمِيَ عَلَيْهَا فِي نَارِ جَهَنَّمَ، فَيُكْوَى بِهَا جَنْبُهُ وَجَبِينُهُ وَظَهْرُهُ..."
    </p>
    <p class="text-sm">
      "Tidak ada seorang pemilik emas dan perak yang tidak menunaikan haknya (zakatnya), kecuali pada hari kiamat akan dibuatkan untuknya lempengan dari api neraka, lalu dipanaskan dalam neraka Jahanam, lalu disetrika dengannya lambung, dahi, dan punggungnya..."
    </p>
  </div>
  <div class="flex flex-col gap-2 mt-4">
    <strong class="mt-4">Penjelasan :</strong>
    <p>
      Hadis ini berbicara tentang ancaman bagi orang yang tidak menunaikan zakat harta, terutama emas dan perak. Dalam praktiknya, zakat perniagaan dihitung berdasarkan nilai harta dagangan, dan nilai itu sering dikonversi dalam satuan emas atau perak, sehingga diqiyaskan dengan zakat emas dan perak. Cara hitungnya juga sama. Jika nilainya setara 85 gram emas dan sudah dimiliki selama 1 tahun, maka wajib zakat 2,5%.
    </p>
    <div>
      <button
        id="simpanhasilPerniagaan"
        class="p-3 mt-3 border bg-primary text-white rounded-lg">
        Simpan
      </button>
    </div>
  </div>`;
            }
            if (
              item.jenis_zakat &&
              (item.jenis_zakat.toLowerCase().includes("emas") ||
                item.jenis_zakat.toLowerCase().includes("perak"))
            ) {
              return `<table class="w-full table-auto border text-left">
              <thead class="bg-gray-100"><tr><th class="border px-4 py-2">Jenis</th><th class="border px-4 py-2">Berat</th><th class="border px-4 py-2">Harga/gram</th><th class="border px-4 py-2">Total</th><th class="border px-4 py-2">Zakat 2.5%</th></tr></thead>
              <tbody><tr><td class="border px-4 py-2">${
                item.jenis_zakat || "-"
              }</td><td class="border px-4 py-2">${
                item.berat_emas || item.berat_perak || "-"
              }</td><td class="border px-4 py-2">${
                item.harga_pergram || "-"
              }</td><td class="border px-4 py-2">${
                item.total || "-"
              }</td><td class="border px-4 py-2">${
                item.zakat_25 || "-"
              }</td></tr></tbody></table>`;
            }
            if (
              item.jenis_zakat &&
              item.jenis_zakat.toLowerCase().includes("ternak")
            ) {
              return `<table class="w-full table-auto border text-left">
              <thead class="bg-gray-100"><tr><th class="border px-4 py-2">Jenis Ternak</th><th class="border px-4 py-2">Jumlah</th><th class="border px-4 py-2">Zakat</th></tr></thead>
              <tbody><tr><td class="border px-4 py-2">${
                item.jenis_ternak || "-"
              }</td><td class="border px-4 py-2">${
                item.jumlah_ternak || "-"
              }</td><td class="border px-4 py-2">${
                item.zakat_25 || "-"
              }</td></tr></tbody></table>`;
            }
            if (
              item.jenis_zakat &&
              item.jenis_zakat.toLowerCase().includes("rikaz")
            ) {
              return `<table class="w-full table-auto border text-left">
              <thead class="bg-gray-100"><tr><th class="border px-4 py-2">Nilai Temuan</th><th class="border px-4 py-2">Persentase</th><th class="border px-4 py-2">Zakat</th></tr></thead>
              <tbody><tr><td class="border px-4 py-2">${
                item.nilai_barang_temuan || "-"
              }</td><td class="border px-4 py-2">${
                item.persentase_zakat ? item.persentase_zakat + "%" : "-"
              }</td><td class="border px-4 py-2">${
                item.zakat_25 || "-"
              }</td></tr></tbody></table>`;
            }
            // Default
            return '<div class="text-center">Detail tidak tersedia</div>';
          }
          function fetchZakatRiwayat() {
            const token = localStorage.getItem("token");
            if (!token) {
              document.getElementById("zakatRiwayatTableBody").innerHTML =
                '<tr><td colspan="5" class="text-center text-red-600">Anda harus login untuk melihat riwayat zakat.</td></tr>';
              return;
            }
            fetch("http://localhost:4000/zakat-riwayat", {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: token,
              },
            })
              .then(function (response) {
                return response.json();
              })
              .then(function (result) {
                if (result.err || !Array.isArray(result.data)) {
                  document.getElementById("zakatRiwayatTableBody").innerHTML =
                    '<tr><td colspan="5" class="text-center text-red-600">Gagal mengambil data riwayat zakat.</td></tr>';
                  return;
                }
                var riwayatZakat = result.data;
                var tbodyzakat = document.getElementById(
                  "zakatRiwayatTableBody"
                );
                tbodyzakat.innerHTML = "";
                if (riwayatZakat.length === 0) {
                  tbodyzakat.innerHTML =
                    '<tr><td colspan="5" class="text-center">Belum ada riwayat zakat.</td></tr>';
                  return;
                }
                function formatRupiah(num) {
                  return "Rp " + Number(num).toLocaleString("id-ID");
                }
                riwayatZakat.forEach(function (item, idx) {
                  var tr = document.createElement("tr");
                  var jumlahZakat = "-";
                  if (typeof item.zakat_25 === "number") {
                    jumlahZakat = formatRupiah(item.zakat_25);
                  } else if (typeof item.zakat_25 === "string") {
                    // Jika string hanya angka, tampilkan sebagai rupiah
                    if (/^\d+$/.test(item.zakat_25.trim())) {
                      jumlahZakat = formatRupiah(Number(item.zakat_25));
                    } else {
                      // Jika string mengandung huruf atau campuran angka dan huruf, tampilkan apa adanya
                      jumlahZakat = item.zakat_25;
                    }
                  }
                  tr.innerHTML = `
                  <td class="border px-3 py-2 text-center">${idx + 1}</td>
                  <td class="border px-3 py-2">${
                    item.created_at ? item.created_at.split("T")[0] : "-"
                  }</td>
                  <td class="border px-3 py-2">${item.jenis_zakat || "-"}</td>
                  <td class="border px-3 py-2">${item.keterangan_nishab}</td>
                  <td class="border px-3 py-2">${jumlahZakat}</td>
                  <td class="border px-3 py-2 text-center">
                    <button class="bg-biru text-black px-2 py-1 rounded mr-2 btn-lihat-zakat" data-idx="${idx}" title="Lihat">Lihat</button>
                    <button class="bg-abu text-black px-2 py-1 rounded mr-2 btn-save-pdf" data-idx="${idx}" title="Save PDF">Save</button>
                    <button class="bg-red text-white px-2 py-1 rounded btn-hapus-zakat" data-idx="${idx}" title="Hapus">Hapus</button>
                  </td>
                `;
                  tbodyzakat.appendChild(tr);
                });
                // Event listener tombol Lihat
                setTimeout(function () {
                  var btns = document.querySelectorAll(".btn-lihat-zakat");
                  btns.forEach(function (btn) {
                    btn.onclick = function () {
                      var idx = btn.getAttribute("data-idx");
                      var item = riwayatZakat[idx];
                      document.getElementById("zakatDetailContent").innerHTML =
                        renderZakatDetailTable(item);
                      document.getElementById(
                        "zakatDetailModal"
                      ).style.display = "flex";
                    };
                  });
                  // Save PDF
                  var btnsPdf = document.querySelectorAll(".btn-save-pdf");
                  btnsPdf.forEach(function (btn) {
                    btn.onclick = function () {
                      var idx = btn.getAttribute("data-idx");
                      var item = riwayatZakat[idx];
                      var detailHtml = renderZakatDetailTable(item);
                      var win = window.open("", "", "width=800,height=600");
                      win.document.write(
                        "<html><head><title>Riwayat Zakat</title>"
                      );
                      win.document.write(
                        "<style>body{font-family:sans-serif;}table{border-collapse:collapse;width:100%;}th,td{border:1px solid #888;padding:8px;}thead{background:#eee;}</style>"
                      );
                      win.document.write("</head><body>");
                      win.document.write("<h2>Detail Zakat</h2>");
                      win.document.write(detailHtml);
                      win.document.write("</body></html>");
                      win.document.close();
                      win.print();
                    };
                  });
                  // Hapus
                  var btnsHapus = document.querySelectorAll(".btn-hapus-zakat");
                  btnsHapus.forEach(function (btn) {
                    btn.onclick = function () {
                      var idx = btn.getAttribute("data-idx");
                      var item = riwayatZakat[idx];
                      if (!confirm("Yakin ingin menghapus data zakat ini?"))
                        return;
                      var token = localStorage.getItem("token");
                      fetch("http://localhost:4000/zakat-riwayat/" + item.id, {
                        method: "DELETE",
                        headers: {
                          "Content-Type": "application/json",
                          Authorization: token,
                        },
                      })
                        .then(function (res) {
                          return res.json();
                        })
                        .then(function (res) {
                          if (res.err) {
                            alert("Gagal menghapus data!");
                          } else {
                            alert("Data berhasil dihapus!");
                            fetchZakatRiwayat();
                          }
                        })
                        .catch(function () {
                          alert("Terjadi kesalahan koneksi!");
                        });
                    };
                  });
                  document.getElementById("closeZakatDetailModal").onclick =
                    function () {
                      document.getElementById(
                        "zakatDetailModal"
                      ).style.display = "none";
                    };
                  document.getElementById("zakatDetailModal").onclick =
                    function (e) {
                      if (e.target === this) this.style.display = "none";
                    };
                }, 0);
              })
              .catch(function (err) {
                document.getElementById("zakatRiwayatTableBody").innerHTML =
                  '<tr><td colspan="5" class="text-center text-red-600">Terjadi kesalahan koneksi.</td></tr>';
              });
          }
          document.addEventListener("DOMContentLoaded", fetchZakatRiwayat);
        </script>
      </div>
    </div>
  </div>
</div>

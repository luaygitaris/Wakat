<div
  id="waris-riwayat-aaa"
  class="content px-4 sm:px-6 lg:px-8 py-6"
  style="display: none; font-family: 'Poppins', sans-serif"
>
  <div class="max-w-screen-xl mx-auto">
    <div class="bg-white mt-2 shadow-md rounded-2xl p-8 border border-gray-100">
      <div class="flex justify-between items-center mb-4 m-4">
        <h3 class="text-xl font-semibold text-blue-700 flex items-center gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-blue-700"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.962a1 1 0 00.95.69h4.188c.969 0 1.371 1.24.588 1.81l-3.39 2.462a1 1 0 00-.364 1.118l1.287 3.961c.3.922-.755 1.688-1.538 1.118l-3.39-2.462a1 1 0 00-1.175 0l-3.39 2.462c-.783.57-1.838-.196-1.538-1.118l1.287-3.961a1 1 0 00-.364-1.118L2.049 9.39c-.783-.57-.38-1.81.588-1.81h4.188a1 1 0 00.95-.69l1.286-3.962z"
            />
          </svg>
          Riwayat Waris
        </h3>
        <button
          id="downloadPDFBtn"
          style="background-color: #1e40af"
          class="hover:bg-blue-700 text-white font-bold py-2 px-4 mt-2 mr-2 rounded"
        >
          Download PDF
        </button>
      </div>

      <div class="overflow-x-auto">
        <table
          class="w-full text-sm text-left text-gray-700 border text-center"
        >
          <thead class="bg-gray-200 text-gray-800">
            <tr>
              <th class="px-4 py-2 border">No</th>
              <th class="px-4 py-2 border">Tanggal Dibuat</th>
              <th class="px-4 py-2 border">Nama Almarhum</th>
              <th class="px-4 py-2 border">Jumlah Harta Warisan</th>
              <th class="px-4 py-2 border">Aksi</th>
            </tr>
          </thead>
          <tbody id="warisRiwayatTableBody">
            <!-- Data akan dimasukkan di sini -->
          </tbody>
        </table>
      </div>

      <!-- MODAL DETAIL -->
      <div
        id="modalDetail"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 hidden"
      >
        <div
          class="bg-white rounded-xl shadow-lg w-full h-full max-w-md mt-2 p-3 relative"
        >
          <h2 class="text-lg font-semibold text-blue-700 mb-4">
            Detail Warisan
          </h2>
          <table class="w-full text-sm text-left text-gray-700 mr-4">
            <tbody>
              <tr>
                <td class="py-2 font-medium w-1/3">Nama</td>
                <td id="modalNama"></td>
              </tr>
              <tr>
                <td class="py-2 font-medium">Tanggal</td>
                <td id="modalTanggal"></td>
              </tr>
              <tr>
                <td class="py-2 font-medium">Jumlah</td>
                <td id="modalJumlah"></td>
              </tr>
            </tbody>
          </table>
          <button
            onclick="closeModal()"
            class="absolute top-3 right-4 text-gray-400 hover:text-black text-xl"
          >
            &times;
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
